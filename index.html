<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>나의 홈</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --pink:#f4a7b9;--pink2:#c47fa0;--pink3:#e088a8;
    --bg:linear-gradient(160deg,#fdf0f5 0%,#f5f0ff 50%,#f0f8ff 100%);
    --card:#fff8f5;--border:#f0dde8;--text:#5a4a5a;--muted:#9e8ea0;
    --shadow:rgba(200,160,180,0.15);
  }
  body{
    background:var(--bg);min-height:100vh;color:var(--text);
    font-family:'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif;
    padding:16px 14px 80px;font-size:15px;
  }
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:0 2px;}
  .top-left .date{font-size:0.8rem;font-weight:700;color:var(--pink2);}
  .top-left .clock{font-size:1.6rem;font-weight:900;color:var(--text);letter-spacing:-0.5px;line-height:1.1;}
  .logo{font-size:1.2rem;font-weight:800;color:var(--pink2);}
  .card{background:var(--card);border:1.5px solid var(--border);border-radius:20px;box-shadow:0 3px 16px var(--shadow);padding:18px;margin-bottom:14px;}

  /* 명언 */
  .quote-card{background:linear-gradient(135deg,#fff0f8,#f5eeff);border-color:#e8cce0;text-align:center;position:relative;overflow:hidden;padding:20px 20px 16px;}
  .quote-card::before{content:'❝';font-size:5rem;color:var(--pink);opacity:0.15;position:absolute;top:-8px;left:8px;line-height:1;}
  .quote-deco{font-size:1.2rem;margin-bottom:8px;}
  .quote-en{font-size:0.95rem;font-style:italic;color:#7a5a7a;line-height:1.7;margin-bottom:8px;font-weight:500;}
  .quote-ko{font-size:0.88rem;color:#a07898;line-height:1.6;margin-bottom:10px;}
  .quote-author{font-size:0.82rem;color:var(--pink2);font-weight:700;}

  /* 검색 */
  .search-card{padding:14px 16px;}
  .search-inner{display:flex;align-items:center;gap:8px;background:#fff5f9;border:2px solid #f2c5d8;border-radius:50px;padding:10px 16px;}
  .search-inner:focus-within{border-color:var(--pink);box-shadow:0 0 0 3px rgba(244,167,185,0.15);}
  .search-inner input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:0.95rem;}
  .search-inner input::placeholder{color:#c8a8b8;}
  .search-btn{background:linear-gradient(135deg,var(--pink),var(--pink2));border:none;border-radius:50px;padding:8px 16px;color:#fff;font-size:0.88rem;cursor:pointer;font-weight:700;white-space:nowrap;}

  /* 날씨 */
  .weather-card{background:linear-gradient(135deg,#e8f4ff,#f0e8ff);border-color:#c8dff5;padding:16px 18px;}
  .weather-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .weather-icon{font-size:2.8rem;line-height:1;}
  .weather-temp{font-size:2.4rem;font-weight:900;color:#5a7aaa;line-height:1;}
  .weather-sub{font-size:0.8rem;color:#7a90b8;margin-top:3px;}
  .weather-right{margin-left:auto;text-align:right;}
  .weather-stat{font-size:0.82rem;color:#7a90b8;font-weight:600;line-height:1.7;}
  .weather-loc{font-size:0.75rem;color:var(--muted);margin-top:2px;}
  .dust-row{display:flex;gap:10px;}
  .dust-badge{flex:1;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;}
  .dust-badge .d-icon{font-size:1.2rem;}
  .dust-badge .d-val{font-size:0.85rem;font-weight:800;line-height:1.2;}
  .dust-badge .d-lbl{font-size:0.72rem;margin-top:1px;}
  .dust-good{background:#e8faf0;color:#2e8b57;border:1.5px solid #b8e8c8;}
  .dust-normal{background:#fff8e0;color:#c47a00;border:1.5px solid #f0d88c;}
  .dust-bad{background:#fff0e0;color:#d06030;border:1.5px solid #f0c8a0;}
  .dust-vbad{background:#ffe8e8;color:#c03030;border:1.5px solid #f0a8a8;}

  /* 할일 */
  .todo-tabs{display:flex;gap:8px;margin-bottom:14px;}
  .todo-tab{flex:1;padding:10px;border-radius:14px;border:1.5px solid var(--border);background:#fff5f9;color:var(--pink2);font-size:0.88rem;font-weight:700;cursor:pointer;text-align:center;transition:all 0.15s;}
  .todo-tab.active{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;border-color:transparent;}
  .todo-panel{display:none;}
  .todo-panel.active{display:block;}
  .week-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .week-tabs::-webkit-scrollbar{display:none;}
  .week-tab{border:1.5px solid #f2c5d8;border-radius:20px;padding:5px 12px;font-size:0.78rem;cursor:pointer;background:#fff5f9;color:var(--pink2);font-weight:700;white-space:nowrap;flex-shrink:0;}
  .week-tab.active{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;border-color:transparent;}
  .todo-input-row{display:flex;gap:8px;margin-bottom:12px;}
  .todo-input{flex:1;border:1.5px solid #f2c5d8;border-radius:50px;padding:9px 14px;font-size:0.88rem;outline:none;background:#fff5f9;color:var(--text);}
  .todo-input:focus{border-color:var(--pink);}
  .todo-input::placeholder{color:#c8a8b8;}
  .todo-add-btn{background:linear-gradient(135deg,var(--pink),var(--pink2));border:none;border-radius:50px;padding:9px 16px;color:#fff;font-size:0.88rem;cursor:pointer;font-weight:700;}
  .todo-list{list-style:none;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;}
  .todo-item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#fff;border:1.5px solid #f5e0ec;border-radius:14px;}
  .todo-item.done .todo-text{text-decoration:line-through;color:#c8a8b8;}
  .todo-cb{width:18px;height:18px;accent-color:var(--pink3);cursor:pointer;flex-shrink:0;}
  .todo-text{flex:1;font-size:0.88rem;color:var(--text);word-break:break-all;}
  .todo-del{background:none;border:none;color:#e0b8c8;cursor:pointer;font-size:1rem;padding:0 2px;flex-shrink:0;}
  .todo-count-badge{font-size:0.72rem;background:linear-gradient(135deg,var(--pink),var(--pink3));color:#fff;padding:2px 8px;border-radius:20px;font-weight:700;margin-left:6px;}
  .todo-empty{text-align:center;color:#c8a8b8;font-size:0.88rem;padding:18px 0;}

  /* 섹션 */
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px;}
  .section-title{font-size:0.95rem;font-weight:800;color:#b06090;}
  .news-badge{font-size:0.7rem;padding:2px 8px;border-radius:20px;background:linear-gradient(135deg,var(--pink),var(--pink3));color:#fff;font-weight:700;margin-left:6px;}
  .refresh-btn{background:none;border:1.5px solid var(--border);border-radius:20px;color:var(--muted);font-size:0.8rem;padding:4px 12px;cursor:pointer;}
  .refresh-btn:active{border-color:var(--pink);color:var(--pink2);}

  /* 뉴스 */
  .news-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
  .news-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:14px 16px;text-decoration:none;display:block;box-shadow:0 2px 10px var(--shadow);}
  .news-card:active{opacity:0.75;}
  .news-tag{font-size:0.72rem;font-weight:700;border-radius:20px;padding:2px 10px;display:inline-block;margin-bottom:8px;}
  .tag-disability{background:#e8faf0;color:#4ab870;border:1px solid #b8e8c8;}
  .tag-ai{background:#e8f0ff;color:#5a80d0;border:1px solid #b8ccf0;}
  .news-title{font-size:0.9rem;font-weight:700;color:var(--text);line-height:1.5;margin-bottom:5px;}
  .news-summary{font-size:0.8rem;color:var(--muted);line-height:1.6;}
  .news-date{font-size:0.72rem;color:#c8a8b8;margin-top:6px;}

  /* 로딩/에러 */
  .spinner{display:inline-block;width:15px;height:15px;border:2px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-msg{color:var(--muted);font-size:0.9rem;text-align:center;padding:16px 0;}
  .error-msg{color:#e08080;font-size:0.85rem;text-align:center;padding:12px 0;}

  /* 꽃잎 */
  .petal{position:fixed;pointer-events:none;animation:fall linear forwards;z-index:0;}
  @keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:0.6;}100%{transform:translateY(110vh) rotate(360deg);opacity:0;}}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-left">
    <div class="date" id="dateLabel"></div>
    <div class="clock" id="clock"></div>
  </div>
  <div class="logo">🌸 나의 홈</div>
</div>

<div class="card quote-card" id="quoteBox"></div>

<div class="card search-card">
  <div class="search-inner">
    <span style="font-size:1.1rem;">🔍</span>
    <input type="text" id="searchInput" placeholder="검색하세요..." onkeydown="if(event.key==='Enter')doSearch()">
    <button class="search-btn" onclick="doSearch()">검색</button>
  </div>
</div>

<div class="card weather-card" id="weatherCard">
  <div class="loading-msg"><span class="spinner"></span>서울 서초구 날씨 불러오는 중...</div>
</div>

<div class="card" style="padding:18px;">
  <div class="todo-tabs">
    <div class="todo-tab active" id="tab-today" onclick="switchTodo('today')">📋 오늘의 할일 <span class="todo-count-badge" id="todayBadge">0</span></div>
    <div class="todo-tab" id="tab-week" onclick="switchTodo('week')">📅 이번주 할일 <span class="todo-count-badge" id="weekBadge">0</span></div>
  </div>
  <div class="todo-panel active" id="panel-today">
    <div class="todo-input-row">
      <input class="todo-input" id="todayInput" placeholder="할일 추가..." onkeydown="if(event.key==='Enter')addTodo('today')">
      <button class="todo-add-btn" onclick="addTodo('today')">추가</button>
    </div>
    <ul class="todo-list" id="todayList"></ul>
  </div>
  <div class="todo-panel" id="panel-week">
    <div class="week-tabs" id="weekTabs"></div>
    <div class="todo-input-row">
      <input class="todo-input" id="weekInput" placeholder="할일 추가..." onkeydown="if(event.key==='Enter')addTodo('week')">
      <button class="todo-add-btn" onclick="addTodo('week')">추가</button>
    </div>
    <ul class="todo-list" id="weekList"></ul>
  </div>
</div>

<div class="section-header">
  <div class="section-title">♿ 장애인 뉴스<span class="news-badge">실시간</span></div>
  <button class="refresh-btn" onclick="loadDisabilityNews()">↻ 새로고침</button>
</div>
<div class="news-list" id="disabilityNews">
  <div class="loading-msg"><span class="spinner"></span>기사 불러오는 중...</div>
</div>

<div class="section-header">
  <div class="section-title">🤖 AI 뉴스<span class="news-badge">실시간</span></div>
  <button class="refresh-btn" onclick="loadAINews()">↻ 새로고침</button>
</div>
<div class="news-list" id="aiNews">
  <div class="loading-msg"><span class="spinner"></span>기사 불러오는 중...</div>
</div>

<script>
// ── 시계 ──
function updateClock(){
  const n=new Date(),days=['일','월','화','수','목','금','토'];
  document.getElementById('dateLabel').textContent=`${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 (${days[n.getDay()]})`;
  document.getElementById('clock').textContent=n.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock,1000); updateClock();

// ── 검색 ──
function doSearch(){const q=document.getElementById('searchInput').value.trim();if(q)window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`);}

// ── 날씨 ──
const WMO={0:'맑음',1:'대체로 맑음',2:'구름 조금',3:'흐림',45:'안개',48:'안개',51:'이슬비',53:'이슬비',55:'이슬비',61:'비',63:'비',65:'강한 비',71:'눈',73:'눈',75:'폭설',80:'소나기',81:'소나기',82:'강한 소나기',95:'뇌우',99:'뇌우'};
const WMO_ICON={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',99:'⛈️'};
function dustClass(v,t){if(t==='pm10'){if(v<=30)return'good';if(v<=80)return'normal';if(v<=150)return'bad';return'vbad';}else{if(v<=15)return'good';if(v<=35)return'normal';if(v<=75)return'bad';return'vbad';}}
function dustLabel(v,t){if(t==='pm10'){if(v<=30)return'좋음';if(v<=80)return'보통';if(v<=150)return'나쁨';return'매우나쁨';}else{if(v<=15)return'좋음';if(v<=35)return'보통';if(v<=75)return'나쁨';return'매우나쁨';}}
async function loadWeather(){
  const el=document.getElementById('weatherCard');
  try{
    const[wR,aR]=await Promise.all([
      fetch('https://api.open-meteo.com/v1/forecast?latitude=37.4837&longitude=127.0324&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weathercode&timezone=Asia/Seoul'),
      fetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=37.4837&longitude=127.0324&current=pm10,pm2_5&timezone=Asia/Seoul')
    ]);
    const wd=await wR.json(),ad=await aR.json();
    const c=wd.current,code=c.weathercode;
    const pm10=Math.round(ad.current.pm10),pm25=Math.round(ad.current.pm2_5);
    el.innerHTML=`
      <div class="weather-top">
        <div class="weather-icon">${WMO_ICON[code]||'🌡️'}</div>
        <div>
          <div class="weather-temp">${Math.round(c.temperature_2m)}°C</div>
          <div class="weather-sub">${WMO[code]||''} · 체감 ${Math.round(c.apparent_temperature)}°C</div>
        </div>
        <div class="weather-right">
          <div class="weather-stat">💧 ${c.relative_humidity_2m}%</div>
          <div class="weather-stat">🌬️ ${c.wind_speed_10m}㎞/h</div>
          <div class="weather-loc">📍 서울 서초구</div>
        </div>
      </div>
      <div class="dust-row">
        <div class="dust-badge dust-${dustClass(pm10,'pm10')}">
          <div class="d-icon">🌫️</div>
          <div><div class="d-val">PM10 ${pm10}㎍/㎥</div><div class="d-lbl">${dustLabel(pm10,'pm10')}</div></div>
        </div>
        <div class="dust-badge dust-${dustClass(pm25,'pm25')}">
          <div class="d-icon">💨</div>
          <div><div class="d-val">PM2.5 ${pm25}㎍/㎥</div><div class="d-lbl">${dustLabel(pm25,'pm25')}</div></div>
        </div>
      </div>`;
  }catch(e){el.innerHTML='<div class="loading-msg">⚠️ 날씨를 불러올 수 없습니다.</div>';}
}
loadWeather();

// ── 할일 (localStorage) ──
function loadTodos(){try{return JSON.parse(localStorage.getItem('todos_mobile_v1'))||{today:[],week:{}};}catch{return{today:[],week:{}};}}
function saveTodos(){localStorage.setItem('todos_mobile_v1',JSON.stringify(todos));}
let todos=loadTodos();
let selectedWeekDay=null;

function switchTodo(panel){
  document.querySelectorAll('.todo-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.todo-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+panel).classList.add('active');
  document.getElementById('panel-'+panel).classList.add('active');
}
function buildWeekTabs(){
  const now=new Date(),days=['일','월','화','수','목','금','토'];
  let html='';
  for(let i=0;i<7;i++){
    const d=new Date(now);d.setDate(now.getDate()-now.getDay()+i);
    const key=d.toDateString(),isToday=key===now.toDateString();
    if(!todos.week[key])todos.week[key]=[];
    if(selectedWeekDay===null&&isToday)selectedWeekDay=key;
    html+=`<button class="week-tab${selectedWeekDay===key?' active':''}" onclick="selectWeekDay('${key}')">${isToday?'오늘 ':''}${days[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}</button>`;
  }
  document.getElementById('weekTabs').innerHTML=html;
}
function selectWeekDay(key){selectedWeekDay=key;buildWeekTabs();renderWeekList();}
function renderTodayList(){
  const items=todos.today||[],list=document.getElementById('todayList');
  list.innerHTML=items.length?items.map((t,i)=>`
    <li class="todo-item${t.done?' done':''}">
      <input type="checkbox" class="todo-cb"${t.done?' checked':''} onchange="toggleTodo('today',${i})">
      <span class="todo-text">${t.text}</span>
      <button class="todo-del" onclick="delTodo('today',${i})">✕</button>
    </li>`).join(''):'<li class="todo-empty">할일이 없습니다 🌸</li>';
  const done=items.filter(t=>t.done).length;
  document.getElementById('todayBadge').textContent=`${done}/${items.length}`;
}
function renderWeekList(){
  const items=todos.week[selectedWeekDay]||[],list=document.getElementById('weekList');
  list.innerHTML=items.length?items.map((t,i)=>`
    <li class="todo-item${t.done?' done':''}">
      <input type="checkbox" class="todo-cb"${t.done?' checked':''} onchange="toggleTodo('week',${i})">
      <span class="todo-text">${t.text}</span>
      <button class="todo-del" onclick="delTodo('week',${i})">✕</button>
    </li>`).join(''):'<li class="todo-empty">할일이 없습니다 🌸</li>';
  const all=Object.values(todos.week).flat(),done=all.filter(t=>t.done).length;
  document.getElementById('weekBadge').textContent=`${done}/${all.length}`;
}
function addTodo(type){
  const inp=document.getElementById(type==='today'?'todayInput':'weekInput');
  const text=inp.value.trim();if(!text)return;
  if(type==='today'){todos.today.push({text,done:false});renderTodayList();}
  else{if(!todos.week[selectedWeekDay])todos.week[selectedWeekDay]=[];todos.week[selectedWeekDay].push({text,done:false});renderWeekList();}
  saveTodos();inp.value='';
}
function toggleTodo(type,idx){
  if(type==='today'){todos.today[idx].done=!todos.today[idx].done;renderTodayList();}
  else{todos.week[selectedWeekDay][idx].done=!todos.week[selectedWeekDay][idx].done;renderWeekList();}
  saveTodos();
}
function delTodo(type,idx){
  if(type==='today'){todos.today.splice(idx,1);renderTodayList();}
  else{todos.week[selectedWeekDay].splice(idx,1);renderWeekList();}
  saveTodos();
}
buildWeekTabs();renderTodayList();renderWeekList();

// ── RSS 뉴스 ──
// CORS 프록시 두 개 준비 (첫 번째 실패 시 두 번째 시도)
const PROXIES=[
  url=>`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
  url=>`https://corsproxy.io/?${encodeURIComponent(url)}`
];

async function fetchRSS(rssUrl){
  for(const proxy of PROXIES){
    try{
      const res=await fetch(proxy(rssUrl),{signal:AbortSignal.timeout(8000)});
      if(!res.ok)continue;
      const json=await res.json();
      const text=json.contents||json.body||'';
      if(!text)continue;
      const parser=new DOMParser();
      const doc=parser.parseFromString(text,'application/xml');
      if(doc.querySelector('parsererror'))continue;
      return doc;
    }catch(e){continue;}
  }
  return null;
}

function parseItems(doc,max=4){
  const items=[...doc.querySelectorAll('item')].slice(0,max);
  return items.map(it=>{
    const title=it.querySelector('title')?.textContent?.trim()||'';
    const link=it.querySelector('link')?.textContent?.trim()||it.querySelector('guid')?.textContent?.trim()||'#';
    const desc=(it.querySelector('description')?.textContent||'').replace(/<[^>]+>/g,'').trim().slice(0,100);
    const pubDate=it.querySelector('pubDate')?.textContent?.trim()||'';
    let dateStr='';
    if(pubDate){try{const d=new Date(pubDate);dateStr=`${d.getMonth()+1}/${d.getDate()}`;}catch{}}
    return{title,link,desc,dateStr};
  });
}

function renderNewsItems(containerId,items,tagClass,tagLabel){
  const el=document.getElementById(containerId);
  if(!items||!items.length){el.innerHTML='<div class="error-msg">기사를 불러올 수 없습니다.<br>잠시 후 새로고침 해주세요.</div>';return;}
  el.innerHTML=items.map(a=>`
    <a class="news-card" href="${a.link}" target="_blank" rel="noopener">
      <span class="news-tag ${tagClass}">${tagLabel}</span>
      <div class="news-title">${a.title}</div>
      ${a.desc?`<div class="news-summary">${a.desc}...</div>`:''}
      ${a.dateStr?`<div class="news-date">${a.dateStr}</div>`:''}
    </a>`).join('');
}

// 장애인 뉴스 — 에이블뉴스 RSS (전문 매체)
async function loadDisabilityNews(){
  document.getElementById('disabilityNews').innerHTML='<div class="loading-msg"><span class="spinner"></span>장애인 뉴스 불러오는 중...</div>';
  const RSS_URLS=[
    'https://www.ablenews.co.kr/rss/allArticle.xml',  // 에이블뉴스 전체
    'https://news.google.com/rss/search?q=장애인&hl=ko&gl=KR&ceid=KR:ko' // 구글 뉴스 백업
  ];
  let items=null;
  for(const url of RSS_URLS){
    const doc=await fetchRSS(url);
    if(doc){items=parseItems(doc,4);if(items.length)break;}
  }
  renderNewsItems('disabilityNews',items,'tag-disability','♿ 장애인');
}

// AI 뉴스 — 구글 뉴스 RSS
async function loadAINews(){
  document.getElementById('aiNews').innerHTML='<div class="loading-msg"><span class="spinner"></span>AI 뉴스 불러오는 중...</div>';
  const RSS_URLS=[
    'https://news.google.com/rss/search?q=인공지능+AI&hl=ko&gl=KR&ceid=KR:ko',
    'https://news.google.com/rss/search?q=AI+artificial+intelligence&hl=ko&gl=KR&ceid=KR:ko'
  ];
  let items=null;
  for(const url of RSS_URLS){
    const doc=await fetchRSS(url);
    if(doc){items=parseItems(doc,4);if(items.length)break;}
  }
  renderNewsItems('aiNews',items,'tag-ai','🤖 AI');
}

loadDisabilityNews();
loadAINews();

// ── 꽃잎 ──
function spawnPetal(){
  const p=['🌸','🌺','🌼','🌷'];
  const el=document.createElement('div');el.className='petal';
  el.textContent=p[Math.floor(Math.random()*p.length)];
  el.style.left=Math.random()*100+'vw';
  el.style.animationDuration=(8+Math.random()*8)+'s';
  el.style.fontSize=(0.6+Math.random()*0.5)+'rem';
  el.style.opacity=0.2+Math.random()*0.35;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),16000);
}
setInterval(spawnPetal,2500);spawnPetal();
